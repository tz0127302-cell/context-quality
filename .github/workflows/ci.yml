name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: test -z "$(git status --porcelain -- dist)"
      - run: node dist/cli.js --help
      - run: node dist/cli.js score examples/fixture-pack --threshold 0
      - run: node dist/cli.js score src README.md package.json action.yml --threshold 40
