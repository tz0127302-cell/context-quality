name: Context quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cqs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: examples/fixture-pack
          threshold: '50'
          comment: 'false'
          fail-on-secrets: 'false'
